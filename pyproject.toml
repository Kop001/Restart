[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "0.1.0"
description = "Джарвис — голосовой агент-ассистент на Claude API с инструментами, памятью и напоминаниями"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "anthropic>=1.4.0",
]

[project.optional-dependencies]
# Микрофон + локальное распознавание речи
voice = [
    "sounddevice>=0.4.6",
    "numpy>=1.24",
    "faster-whisper>=1.0.0",
]
# Кроссплатформенный оффлайн-синтез речи (если нет piper/say/espeak)
tts = [
    "pyttsx3>=2.90",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
jarvis = "jarvis.__main__:main"

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.setuptools.package-data]
"jarvis.dashboard" = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Заглушка Messages API лежит рядом с тестами и импортируется по имени.
pythonpath = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E,F — ошибки и стиль; I — порядок импортов; UP — устаревшие конструкции;
# B — типичные ловушки; RUF — правила самого ruff.
select = ["E", "F", "I", "UP", "B", "RUF"]
# Проект русскоязычный: правила про «кириллица похожа на латиницу»
# срабатывают на каждой строке текста и полезного не говорят.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# В тестах нормально трогать внутренности и писать длинные фикстуры.
"tests/*" = ["B011", "RUF001"]
