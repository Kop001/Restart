<title>Джарвис</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23C2603C'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23FAF9F7'/%3E%3C/svg%3E">
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&family=JetBrains+Mono:wght@400&display=swap">
<style>
  /* Светлая тема — основная: спокойная, тёплая, без резкого белого.
     Тёмная повторяет её по ролям, а не выворачивает наизнанку. */
  :root{
    --bg:#faf9f7; --surface:#ffffff; --raised:#f3f0ec;
    --line:#e7e2db; --line-soft:#f0ece6;
    --fg:#2b2825; --dim:#6f675e; --faint:#9a9188;
    --accent:#c2603c; --accent-soft:#f0e0d8;
    --warn:#b4750f; --warn-bg:#fdf6e7;
    --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --serif:"Newsreader",Georgia,"Times New Roman",serif;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --radius:14px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1e1c1a; --surface:#26231f; --raised:#2f2b27;
      --line:#3a3530; --line-soft:#2c2925;
      --fg:#ece7e0; --dim:#a89f94; --faint:#7d746a;
      --accent:#e08356; --accent-soft:#3a2a22;
      --warn:#d8a13f; --warn-bg:#2e2617;
    }
  }
  :root[data-theme="dark"]{
    --bg:#1e1c1a; --surface:#26231f; --raised:#2f2b27;
    --line:#3a3530; --line-soft:#2c2925;
    --fg:#ece7e0; --dim:#a89f94; --faint:#7d746a;
    --accent:#e08356; --accent-soft:#3a2a22;
    --warn:#d8a13f; --warn-bg:#2e2617;
  }

  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:15px/1.6 var(--sans);height:100vh;display:grid;
       grid-template-columns:248px 1fr}
  code,.mono{font-family:var(--mono);font-size:.86em}

  /* ---- боковая колонка ---- */
  aside{background:var(--surface);border-right:1px solid var(--line-soft);
        display:flex;flex-direction:column;padding:18px 12px}
  .brand{display:flex;align-items:center;gap:10px;padding:6px 10px 20px}
  .mark{width:26px;height:26px;flex:none}
  .brand b{font-weight:600;font-size:15px;display:block;line-height:1.25}
  .brand span{color:var(--faint);font-size:12.5px}
  nav{display:flex;flex-direction:column;gap:2px}
  nav button{background:none;border:0;color:var(--dim);font:inherit;text-align:left;
             padding:9px 12px;border-radius:9px;cursor:pointer}
  nav button:hover{background:var(--raised);color:var(--fg)}
  nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:500}
  .foot{margin-top:auto;padding:14px 12px 2px;color:var(--faint);font-size:12px}

  /* ---- полотно ---- */
  main{display:flex;flex-direction:column;min-height:0;align-items:center}
  .column{width:100%;max-width:760px;display:flex;flex-direction:column;min-height:0;flex:1}
  header{padding:26px 8px 14px}
  h1{font-size:20px;font-weight:600;margin:0;letter-spacing:-.01em}
  .sub{color:var(--dim);font-size:13.5px;margin-top:3px}
  .scroll{flex:1;overflow-y:auto;padding:6px 8px 24px;min-height:0}

  /* ---- лента ---- */
  .feed{display:flex;flex-direction:column;gap:22px}
  .said{display:flex;flex-direction:column;gap:5px}
  .said .who{color:var(--faint);font-size:12px}
  .said.me{align-self:flex-end;align-items:flex-end;max-width:78%}
  .said.me .body{background:var(--raised);border-radius:16px 16px 4px 16px;padding:10px 15px}
  .said.ai .body{font-family:var(--serif);font-size:17px;line-height:1.7}
  .body{white-space:pre-wrap}
  .quiet{color:var(--dim);font-size:13.5px;display:flex;gap:12px;align-items:baseline}
  .quiet time{color:var(--faint);font-family:var(--mono);font-size:12px;flex:none}
  .quiet button{opacity:0;transition:opacity .15s}
  .quiet:hover button{opacity:1}
  .folded{color:var(--faint);font-size:13px;cursor:pointer;user-select:none;
          align-self:flex-start;padding:2px 0}
  .folded:hover{color:var(--dim)}
  .folded ul{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:5px}

  .attention{border:1px solid var(--warn);background:var(--warn-bg);
             border-radius:var(--radius);padding:15px 17px;margin-bottom:20px}
  .attention h3{margin:0 0 5px;font-size:13px;color:var(--warn);font-weight:600}
  .attention .what{margin-bottom:13px;word-break:break-word}
  .now{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
  .chip{border:1px solid var(--line);border-radius:99px;padding:4px 12px;
        font-size:12.5px;color:var(--dim);background:var(--surface)}
  .chip.live{border-color:var(--accent);color:var(--accent)}

  /* ---- ввод ---- */
  .compose{width:100%;max-width:760px;padding:0 8px 22px}
  .box{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
       padding:12px 14px;display:flex;gap:10px;align-items:flex-end;
       box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .box:focus-within{border-color:var(--accent)}
  textarea{background:none;border:0;color:var(--fg);font:inherit;resize:none;
           width:100%;max-height:180px;padding:2px 0}
  textarea:focus{outline:none}
  .send{width:32px;height:32px;flex:none;border:0;border-radius:9px;cursor:pointer;
        background:var(--accent);color:#fff;font-size:16px;line-height:1}
  .send:disabled{opacity:.35;cursor:default}

  input{background:var(--surface);border:1px solid var(--line);border-radius:10px;
        color:var(--fg);font:inherit;padding:9px 12px;width:100%}
  input:focus{outline:none;border-color:var(--accent)}
  button.act{background:var(--surface);border:1px solid var(--line);color:var(--fg);
             border-radius:10px;padding:8px 14px;cursor:pointer;font:inherit;white-space:nowrap}
  button.act:hover{border-color:var(--accent);color:var(--accent)}
  button.act.plain{background:none;border-color:transparent;color:var(--faint);padding:4px 7px}
  button.act.plain:hover{color:var(--accent)}
  button:focus-visible,nav button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* ---- справочные разделы ---- */
  .block{margin-bottom:34px}
  .block h2{font-size:15px;font-weight:600;margin:0 0 4px}
  .block .hint{color:var(--dim);font-size:13.5px;margin-bottom:14px;max-width:62ch}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{color:var(--faint);font-size:12px;font-weight:500;text-align:left;padding:0 10px 8px 0}
  td{padding:9px 10px 9px 0;border-top:1px solid var(--line-soft);vertical-align:top}
  td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--dim)}
  .id{font-family:var(--mono);font-size:12px;color:var(--faint)}
  .tag{color:var(--dim);font-size:13.5px}
  .mark-important{color:var(--warn);font-size:12px}
  .grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
  .stat b{display:block;font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;
          letter-spacing:-.02em}
  .stat span{color:var(--dim);font-size:13px}
  .empty{color:var(--faint);font-size:13.5px;padding:8px 0}

  /* ---- карта памяти ---- */
  .canvas-wrap{position:relative;background:var(--surface);border:1px solid var(--line);
               border-radius:var(--radius);height:min(62vh,540px);overflow:hidden}
  .canvas-wrap canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
  .canvas-wrap canvas.held{cursor:grabbing}
  .tip{position:absolute;max-width:270px;background:var(--surface);border:1px solid var(--line);
       border-radius:10px;padding:9px 11px;font-size:13px;line-height:1.45;
       pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.16)}
  .tip span{display:block;color:var(--faint);font-size:12px;margin-top:5px}
  .count{position:absolute;top:12px;left:14px;color:var(--faint);
         font-family:var(--mono);font-size:11.5px;letter-spacing:.02em;
         pointer-events:none}
  .legend{display:flex;gap:7px 18px;flex-wrap:wrap;margin-top:13px;
          color:var(--dim);font-size:12.5px}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:99px;
            margin-right:6px;font-style:normal;vertical-align:baseline}

  .hidden{display:none!important}
  #approve{position:fixed;inset:0;background:rgba(20,18,16,.45);display:none;
           place-items:center;padding:20px}
  #approve .attention{background:var(--surface);max-width:520px;margin:0;
                      box-shadow:0 10px 40px rgba(0,0,0,.18)}

  @media (max-width:760px){
    body{grid-template-columns:1fr;grid-template-rows:1fr auto}
    aside{order:2;flex-direction:row;border-right:0;border-top:1px solid var(--line);
          padding:0;align-items:stretch}
    .brand,.foot{display:none}
    nav{flex-direction:row;flex:1;gap:0}
    nav button{flex:1;text-align:center;border-radius:0;padding:13px 4px}
    nav button.on{background:none;box-shadow:inset 0 2px 0 var(--accent)}
    main{order:1;min-height:0}
    header{padding:18px 16px 10px}
    .scroll{padding:4px 16px 18px}
    .compose{padding:0 12px 12px}
  }
</style>

<aside>
  <div class="brand">
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
      <circle cx="16" cy="16" r="14" fill="var(--accent)"/>
      <circle cx="16" cy="16" r="5" fill="var(--surface)"/>
    </svg>
    <span><b>Джарвис</b><span id="brand-sub">на связи</span></span>
  </div>
  <nav id="nav"></nav>
  <div class="foot" id="foot"></div>
</aside>

<main>
  <div class="column">
    <header><h1 id="title">Разговор</h1><div class="sub" id="subtitle"></div></header>
    <div class="scroll" id="view"></div>
  </div>
  <div class="compose hidden" id="compose">
    <div class="box">
      <textarea id="say" rows="1" placeholder="Скажите что-нибудь…"></textarea>
      <button class="send" id="send" title="Отправить">↑</button>
    </div>
  </div>
</main>

<div id="approve"><div class="attention">
  <h3 id="approve-who">Требуется разрешение</h3>
  <div class="what" id="approve-text"></div>
  <div style="display:flex;gap:8px">
    <button class="act" onclick="resolveApproval(true)">Разрешить</button>
    <button class="act" onclick="resolveApproval(false)">Нет</button>
  </div>
</div></div>

<script>
const SECTIONS = [
  {id:'feed',   label:'Разговор', title:'Разговор', sub:'что было сказано и что случилось'},
  {id:'memory', label:'Память',   title:'Память',   sub:'что Джарвис о вас знает и где это лежит'},
  {id:'graph',  label:'Карта',    title:'Карта памяти', sub:'что с чем связано на самом деле'},
  {id:'system', label:'Система',  title:'Система',  sub:'задачи, напоминания, навыки, расход'},
];

let state = null, current = 'feed', pendingId = null, unfolded = new Set();

const el = html => {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.childElementCount === 1 ? t.content.firstElementChild : t.content;
};
const esc = s => String(s ?? '').replace(/[&<>"]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clock = ts => new Date(ts * 1000).toTimeString().slice(0, 5);

async function api(path, body){
  const opts = body ? {method:'POST', headers:{'Content-Type':'application/json'},
                       body:JSON.stringify(body)} : {};
  return (await fetch(path, opts)).json();
}

function buildNav(){
  const nav = document.getElementById('nav');
  for (const s of SECTIONS){
    const b = el(`<button data-id="${s.id}">${s.label}</button>`);
    b.onclick = () => show(s.id);
    nav.appendChild(b);
  }
}

function show(id){
  current = id;
  const meta = SECTIONS.find(s => s.id === id);
  document.getElementById('title').textContent = meta.title;
  document.getElementById('subtitle').textContent = meta.sub;
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.id === id));
  document.getElementById('compose').classList.toggle('hidden', id !== 'feed');
  render();
}

async function refresh(){
  state = await api('/api/state');
  document.getElementById('brand-sub').textContent =
    state.privacy.private_mode ? 'не записывает' : 'на связи';
  document.getElementById('foot').textContent = `${state.config.model} · ${state.config.effort}`;
  render();
}

function render(){
  const view = document.getElementById('view');
  if (!state){ view.innerHTML = '<div class="empty">Загрузка…</div>'; return; }
  const keep = view.scrollTop, atEnd = view.scrollHeight - view.clientHeight - keep < 60;
  // Холст графа живёт своей жизнью: пересобрать его — значит уронить раскладку,
  // над которой он только что работал. Обновляем данные, а не разметку.
  if (current === 'graph' && view.querySelector('canvas')) return void loadGraph();
  view.innerHTML = '';
  ({feed:viewFeed, memory:viewMemory, graph:viewGraph, system:viewSystem})[current](view);
  view.scrollTop = current === 'feed' && atEnd ? view.scrollHeight : keep;
}

/* ---------- лента ---------- */

function viewFeed(view){
  const running = state.tasks.filter(t => t.status === 'running' || t.status === 'queued');
  if (running.length){
    view.appendChild(el(`<div class="now">${running.map(t =>
      `<span class="chip live">${esc(t.title)} · ${t.elapsed} с</span>`).join('')}</div>`));
  }

  const feed = [...state.feed].reverse();
  const wrap = el('<div class="feed"></div>');
  let silent = [];

  const flush = () => {
    if (!silent.length) return;
    const key = silent[0].id, open = unfolded.has(key);
    const node = el(`<div class="folded">${open ? '▾' : '▸'} ${silent.length}
      ${plural(silent.length)}, промолчал
      ${open ? `<ul>${silent.map(e => `<li>${clock(e.at)} · ${esc(e.text)}
        <span class="id">${esc(e.note)}</span></li>`).join('')}</ul>` : ''}</div>`);
    node.onclick = () => { open ? unfolded.delete(key) : unfolded.add(key); render(); };
    wrap.appendChild(node);
    silent = [];
  };

  for (const e of feed){
    if (e.outcome === 'промолчать'){ silent.push(e); continue; }
    flush();
    if (e.source === 'человек') wrap.appendChild(said('me', 'Вы', e));
    else if (e.source === 'джарвис') wrap.appendChild(said('ai', 'Джарвис', e));
    else {
      const row = el(`<div class="quiet"><time>${clock(e.at)}</time>
        <span>${esc(e.text)}</span>
        <button class="act plain" title="реже показывать такое">тише</button></div>`);
      row.querySelector('button').onclick = () => hush(e.source, e.kind);
      wrap.appendChild(row);
    }
  }
  flush();

  if (!feed.length) wrap.appendChild(el('<div class="empty">Пока ничего не происходило.</div>'));
  view.appendChild(wrap);
}

const said = (cls, who, e) => el(
  `<div class="said ${cls}"><div class="who">${who} · ${clock(e.at)}</div>
   <div class="body">${esc(e.text)}</div></div>`);

const word = (n, one, few, many) => (n % 10 === 1 && n % 100 !== 11) ? one
  : ([2,3,4].includes(n % 10) && ![12,13,14].includes(n % 100)) ? few : many;
const plural = n => word(n, 'событие', 'события', 'событий');

async function hush(source, kind){
  const res = await api('/api/dismiss', {source, kind});
  alert(res.report || res.error);
  refresh();
}

async function send(){
  const box = document.getElementById('say');
  const text = box.value.trim();
  if (!text) return;
  box.value = ''; grow(box);
  const view = document.getElementById('view'), feed = view.querySelector('.feed');
  feed?.appendChild(said('me', 'Вы', {at: Date.now()/1000, text}));
  feed?.appendChild(said('ai', 'Джарвис', {at: Date.now()/1000, text:'…'}));
  view.scrollTop = view.scrollHeight;
  await api('/api/chat', {message:text});
  refresh();
}

function grow(box){
  box.style.height = 'auto';
  box.style.height = Math.min(box.scrollHeight, 180) + 'px';
}

/* ---------- память ---------- */

function viewMemory(view){
  const p = state.privacy;
  view.appendChild(el(`<div class="block">
    <h2>Что он знает</h2>
    <div class="hint">Только действующее. Это и уходит в модель при каждой реплике.</div>
    <table><tr><th>Факт</th><th>Тема</th><th>Обращений</th><th></th></tr>
    ${state.memory.map(f => `<tr>
      <td>${esc(f.text)}${f.importance === 'high'
        ? ' <span class="mark-important">важно</span>' : ''}</td>
      <td class="tag">${esc(f.tag)}</td><td class="num">${f.uses ?? 0}</td>
      <td><button class="act plain" onclick="forgetFact('${f.id}')">забыть</button></td>
    </tr>`).join('') || '<tr><td colspan="4" class="empty">Пока ничего.</td></tr>'}</table></div>

    ${state.memory_stale.length ? `<div class="block">
      <h2>Отменённое</h2>
      <div class="hint">В работу не идёт и в модель не отправляется. Видно, чтобы
        заметить, если он заменил не то.</div>
      <table><tr><th>Было</th><th>Заменено на</th><th>Когда</th><th></th></tr>
      ${state.memory_stale.map(f => `<tr>
        <td class="tag">${esc(f.text)}</td><td class="id">${esc(f.superseded_by || '')}</td>
        <td class="tag">${esc(f.superseded_at || '')}</td>
        <td><button class="act plain" onclick="forgetFact('${f.id}')">стереть</button></td>
      </tr>`).join('')}</table></div>` : ''}

    <div class="block">
      <h2>Где это лежит</h2>
      <div class="hint"><code>${esc(p.state_dir)}</code> — вне репозитория, права только
        у вас. Запись на диск ${p.private_mode
          ? '<b>выключена</b>: разговор не сохранится.' : 'включена.'}</div>
      <table>
        <tr><td>Переписка</td><td class="num">${p.counts.history}</td>
            <td><button class="act plain" onclick="wipe(['history'])">стереть</button></td></tr>
        <tr><td>Память</td><td class="num">${p.counts.memory}</td>
            <td><button class="act plain" onclick="wipe(['memory'])">стереть</button></td></tr>
        <tr><td>Напоминания</td><td class="num">${p.counts.reminders}</td>
            <td><button class="act plain" onclick="wipe(['reminders'])">стереть</button></td></tr>
        <tr><td>Хроника событий</td><td class="num">${state.chronicle['всего']}</td><td></td></tr>
      </table>
      <div style="margin-top:16px"><button class="act" onclick="wipe()">Стереть всё</button></div>
    </div>

    <div class="block">
      <h2>Что уходит наружу</h2>
      <div class="hint">Из ${state.chronicle['всего']} событий модели показано
        ${state.chronicle['уходило модели']} — остальное разобрано на месте и машину
        не покидало. При вашей реплике уходят память, недавняя переписка и результаты
        вызванных навыков: без этого модель не помнит разговор. Звук с микрофона
        не уходит никогда.</div></div>`));
}

async function forgetFact(id){ await api('/api/memory/forget', {id}); refresh(); }

async function wipe(kinds){
  const what = kinds ? 'это' : 'всё: переписку, память, задачи и напоминания';
  if (!confirm(`Стереть ${what}? Отменить будет нельзя.`)) return;
  const res = await api('/api/wipe', kinds ? {kinds} : {});
  alert(res.report || res.error);
  refresh();
}

/* ---------- карта памяти ---------- */

/* Раскладку никто не задаёт руками: узлы расталкиваются, связи стягивают.
   Где получилось плотно — там память действительно связана. */

let graph = null, canvas = null, ctx = null, tip = null;
let graphAnim = 0, graphAt = 0, alpha = 1, held = null, hover = null;

const HUES = [16, 38, 92, 168, 205, 258, 322];
const hueOf = tag => HUES[Math.abs([...String(tag)]
  .reduce((a, c) => (a * 31 + c.charCodeAt(0)) | 0, 7)) % HUES.length];
const dark = () => matchMedia('(prefers-color-scheme: dark)').matches
  && document.documentElement.dataset.theme !== 'light';
const tone = (tag, alpha = 1) =>
  `hsl(${hueOf(tag)} 48% ${dark() ? 62 : 46}% / ${alpha})`;

// Свечение честное: гаснет за две недели без обращений. Факт, к которому
// не обращались никогда, не светится вовсе.
const freshness = node => {
  if (!node.last_used) return 0;
  const days = (Date.now() - Date.parse(node.last_used.replace(' ', 'T'))) / 86400000;
  return Math.max(0, Math.min(1, 1 - days / 14));
};

function viewGraph(view){
  view.appendChild(el(`<div class="block">
    <div class="hint">Кружок — факт, крупный узел — тема. Размер по числу обращений,
      свечение — насколько недавно факт понадобился. Тонкая линия — принадлежность
      теме, цветная — общие слова с фактом из другой темы, пунктир — замена.
      Заменённое приглушено. Наведите или коснитесь узла, чтобы прочитать;
      его можно оттащить.</div>
    <div class="canvas-wrap"><canvas></canvas>
      <div class="count"></div><div class="tip hidden"></div></div>
    <div class="legend"></div></div>`));
  canvas = view.querySelector('canvas');
  ctx = canvas.getContext('2d');
  tip = view.querySelector('.tip');
  bindGraph();
  loadGraph(true);
  if (!graphAnim) graphAnim = requestAnimationFrame(frame);
}

async function loadGraph(force){
  if (!canvas || (!force && Date.now() - graphAt < 15000)) return;
  graphAt = Date.now();
  merge(await api('/api/graph'));
}

function merge(data){
  const was = new Map((graph?.nodes || []).map(n => [n.id, n]));
  const byId = new Map();
  const w = canvas.clientWidth || 600, h = canvas.clientHeight || 400;
  const nodes = data.nodes.map(raw => {
    const old = was.get(raw.id);
    // Новый узел появляется где придётся: место ему найдут силы, а не мы.
    const node = Object.assign({
      x: old ? old.x : w / 2 + (Math.random() - .5) * w * .55,
      y: old ? old.y : h / 2 + (Math.random() - .5) * h * .55,
      vx: 0, vy: 0}, raw);
    node.r = raw.kind === 'тема' ? 7 + Math.sqrt(raw.weight) * 2.6
                                 : 4 + Math.sqrt(raw.weight) * 1.9;
    byId.set(node.id, node);
    return node;
  });
  const links = data.links
    .filter(l => byId.has(l.from) && byId.has(l.to))
    .map(l => ({kind: l.kind, weight: l.weight, a: byId.get(l.from), b: byId.get(l.to)}));
  graph = {nodes, links, byId};
  alpha = 1;
  legend();
}

function legend(){
  const box = document.querySelector('.legend'), count = document.querySelector('.count');
  if (!box) return;

  // Счёт настоящий: сколько узлов и связей сейчас на холсте, не круглое число
  // для красоты. Заменённое считаем отдельно — оно в работу не идёт.
  const facts = graph.nodes.filter(n => n.kind === 'факт' && !n.stale).length;
  const stale = graph.nodes.length - facts - graph.nodes.filter(n => n.kind === 'тема').length;
  const ties = graph.links.filter(l => l.kind !== 'тема').length;
  count.textContent = [
    `${facts} ${word(facts, 'факт', 'факта', 'фактов')}`,
    `${ties} ${word(ties, 'связь', 'связи', 'связей')}`,
    stale ? `${stale} ${word(stale, 'заменён', 'заменённых', 'заменённых')}` : '',
  ].filter(Boolean).join(' · ');

  const tags = graph.nodes.filter(n => n.kind === 'тема')
    .sort((a, b) => b.weight - a.weight);
  box.innerHTML = tags.map(t =>
    `<span><i style="background:${tone(t.text)}"></i>${esc(t.text)} · ${t.weight}</span>`
  ).join('') || '<span>Тем пока нет.</span>';
}

function frame(){
  graphAnim = 0;
  if (current !== 'graph' || !canvas || !canvas.isConnected) return;
  if (graph){ tick(); draw(); }
  graphAnim = requestAnimationFrame(frame);
}

function tick(){
  const w = canvas.clientWidth, h = canvas.clientHeight, cx = w / 2, cy = h / 2;
  const nodes = graph.nodes;
  for (const n of nodes){ n.vx *= .86; n.vy *= .86; }

  for (let i = 0; i < nodes.length; i++){
    const a = nodes[i];
    for (let j = i + 1; j < nodes.length; j++){
      const b = nodes[j];
      let dx = b.x - a.x, dy = b.y - a.y, d2 = dx * dx + dy * dy;
      if (d2 > 90000) continue;               // дальше 300 px друг друга не чувствуют
      if (d2 < 1){ dx = Math.random() - .5; dy = Math.random() - .5; d2 = 1; }
      const d = Math.sqrt(d2), f = 1900 / d2;
      a.vx -= dx / d * f; a.vy -= dy / d * f;
      b.vx += dx / d * f; b.vy += dy / d * f;
    }
    a.vx += (cx - a.x) * .0015; a.vy += (cy - a.y) * .0015;
  }

  for (const l of graph.links){
    const dx = l.b.x - l.a.x, dy = l.b.y - l.a.y, d = Math.hypot(dx, dy) || .01;
    const rest = l.kind === 'тема' ? 84 : l.kind === 'замена' ? 44 : 150;
    const k = l.kind === 'тема' ? .020 : l.kind === 'замена' ? .030 : .008;
    const f = (d - rest) * k;
    l.a.vx += dx / d * f; l.a.vy += dy / d * f;
    l.b.vx -= dx / d * f; l.b.vy -= dy / d * f;
  }

  for (const n of nodes){
    if (n === held) continue;
    n.x += n.vx * alpha; n.y += n.vy * alpha;
    n.x = Math.max(n.r + 6, Math.min(w - n.r - 6, n.x));
    n.y = Math.max(n.r + 6, Math.min(h - n.r - 6, n.y));
  }
  // Ниже нуля не опускаем: остывший граф застывает намертво и не отзывается
  // на новый факт, пока его не тронешь.
  alpha = Math.max(.22, alpha * .995);
}

function draw(){
  const w = canvas.clientWidth, h = canvas.clientHeight, dpr = devicePixelRatio || 1;
  if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)){
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);

  if (!graph.nodes.length){
    ctx.fillStyle = css('--faint'); ctx.font = '14px ' + css('--sans');
    ctx.textAlign = 'center';
    ctx.fillText('Память пуста — связывать пока нечего.', w / 2, h / 2);
    return;
  }

  const lit = hover ? near(hover) : null;
  const soft = id => !lit || lit.has(id);

  for (const l of graph.links){
    const on = soft(l.a.id) && soft(l.b.id);
    const faded = l.a.stale || l.b.stale;
    ctx.setLineDash(l.kind === 'замена' ? [3, 4] : []);
    ctx.lineWidth = l.kind === 'родство' ? Math.min(2.2, .7 + l.weight * .35) : 1;
    ctx.strokeStyle = l.kind === 'родство'
      ? tone(l.a.kind === 'тема' ? l.a.text : l.a.tag, on ? (faded ? .18 : .42) : .07)
      : css('--line', on ? (faded ? .5 : 1) : .25);
    ctx.beginPath(); ctx.moveTo(l.a.x, l.a.y); ctx.lineTo(l.b.x, l.b.y); ctx.stroke();
  }
  ctx.setLineDash([]);

  for (const n of graph.nodes){
    const on = soft(n.id), dim = n.stale ? .28 : 1;
    const glow = freshness(n) * (n.stale ? 0 : 1);
    if (glow > .02 && on){
      ctx.beginPath(); ctx.arc(n.x, n.y, n.r + 5 + glow * 7, 0, 7);
      ctx.fillStyle = tone(n.kind === 'тема' ? n.text : n.tag, glow * .17);
      ctx.fill();
    }
    ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, 7);
    ctx.fillStyle = n.kind === 'тема'
      ? tone(n.text, (on ? .9 : .25) * dim)
      : tone(n.tag, (on ? .28 + glow * .5 : .12) * dim);
    ctx.fill();
    ctx.lineWidth = n.importance === 'high' ? 2 : 1;
    ctx.strokeStyle = tone(n.kind === 'тема' ? n.text : n.tag, (on ? .85 : .2) * dim);
    ctx.stroke();
  }

  ctx.font = '11.5px ' + css('--sans');
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  for (const n of graph.nodes){
    if (n.kind !== 'тема') continue;
    ctx.fillStyle = css('--dim', soft(n.id) ? 1 : .3);
    ctx.fillText(n.text, n.x, n.y + n.r + 5);
  }
}

const css = (name, alpha = 1) => {
  const value = getComputedStyle(document.body).getPropertyValue(name).trim();
  return alpha === 1 ? value : `color-mix(in srgb, ${value} ${Math.round(alpha * 100)}%, transparent)`;
};

function near(node){
  const set = new Set([node.id]);
  for (const l of graph.links){
    if (l.a.id === node.id) set.add(l.b.id);
    if (l.b.id === node.id) set.add(l.a.id);
  }
  return set;
}

function at(x, y){
  let best = null, bestD = 1e9;
  for (const n of graph?.nodes || []){
    const d = Math.hypot(n.x - x, n.y - y);
    if (d < n.r + 7 && d < bestD){ best = n; bestD = d; }
  }
  return best;
}

function bindGraph(){
  const spot = event => {
    const box = canvas.getBoundingClientRect();
    return [event.clientX - box.left, event.clientY - box.top];
  };

  canvas.onpointerdown = event => {
    const [x, y] = spot(event);
    held = at(x, y);
    if (!held) return;
    canvas.setPointerCapture(event.pointerId);
    canvas.classList.add('held');
    alpha = 1;
  };

  canvas.onpointermove = event => {
    const [x, y] = spot(event);
    if (held){ held.x = x; held.y = y; held.vx = held.vy = 0; alpha = 1; }
    // На телефоне наведения нет: палец сразу хватает узел, и подпись
    // должна появиться всё равно — иначе прочитать факт нечем.
    const found = held || at(x, y);
    hover = found;
    if (!found) return void tip.classList.add('hidden');
    tip.classList.remove('hidden');
    tip.innerHTML = found.kind === 'тема'
      ? `<b>Тема «${esc(found.text)}»</b><span>${found.weight} действующих фактов</span>`
      : `${esc(found.text)}<span>${esc(found.tag)} · обращений ${found.weight}
         ${found.last_used ? '· последнее ' + esc(found.last_used) : '· ни разу не пригодился'}
         ${found.stale ? '· заменён' : ''}</span>`;
    // Подсказка не должна вылезать за холст: у нижнего края она переезжает вверх.
    const w = canvas.clientWidth, h = canvas.clientHeight;
    const below = y + 16 + tip.offsetHeight < h - 6;
    tip.style.left = Math.max(6, Math.min(w - tip.offsetWidth - 6, x + 14)) + 'px';
    tip.style.top = Math.max(6, below ? y + 16 : y - tip.offsetHeight - 14) + 'px';
  };

  const release = () => { held = null; canvas.classList.remove('held'); };
  canvas.onpointerup = release;
  canvas.onpointercancel = release;
  canvas.onpointerleave = () => { release(); hover = null; tip.classList.add('hidden'); };
}

/* ---------- система ---------- */

const TASK = {queued:'в очереди', running:'выполняется', done:'готово',
              failed:'ошибка', cancelled:'остановлена'};

function viewSystem(view){
  const s = state.stats;
  view.appendChild(el(`<div class="block">
    <h2>Задачи</h2>
    <div class="hint">Одновременно работают до ${state.max_parallel_tasks}.</div>
    <div style="display:flex;gap:8px;margin-bottom:14px">
      <input id="tg" placeholder="что сделать — своими словами, со всем контекстом">
      <button class="act" id="tadd">Запустить</button></div>
    <table><tr><th>Задача</th><th>Состояние</th><th>Время</th><th>Отчёт</th><th></th></tr>
    ${state.tasks.map(t => `<tr>
      <td>${esc(t.title)}</td><td class="tag">${TASK[t.status] || t.status}</td>
      <td class="num">${t.elapsed} с</td><td class="tag">${esc(t.error || t.result || '—')}</td>
      <td>${['queued','running'].includes(t.status)
        ? `<button class="act plain" onclick="cancelTask('${t.id}')">стоп</button>` : ''}</td>
    </tr>`).join('') || '<tr><td colspan="5" class="empty">Задач нет.</td></tr>'}</table></div>

    <div class="block"><h2>Напоминания</h2>
    <div style="display:flex;gap:8px;margin-bottom:14px">
      <input id="rt" placeholder="о чём напомнить">
      <input id="rw" placeholder="через 15 минут" style="max-width:220px">
      <button class="act" id="radd">Поставить</button></div>
    <table>${state.reminders.map(r => `<tr><td>${esc(r.text)}</td>
      <td class="tag">${esc(r.due)}</td>
      <td><button class="act plain" onclick="cancelReminder('${r.id}')">отменить</button></td>
    </tr>`).join('') || '<tr><td class="empty">Напоминаний нет.</td></tr>'}</table></div>

    <div class="block"><h2>Что он умеет</h2>
    <div class="hint">${state.skills.length} навыков.</div>
    <table>${state.skills.map(k => `<tr><td class="mono">${esc(k.name)}</td>
      <td class="tag">${esc(k.description || 'серверный инструмент')}</td></tr>`).join('')}
    </table></div>

    <div class="block"><h2>Подключения</h2>
    <table>${state.connections.map(c => `<tr><td>${esc(c.name)}</td>
      <td class="tag">${esc(c.status)}</td></tr>`).join('')}</table></div>

    <div class="block"><h2>Расход</h2>
    <div class="grid">
      <div class="stat"><b>${s.turns}</b><span>ходов</span></div>
      <div class="stat"><b>${s.tool_calls}</b><span>вызовов навыков</span></div>
      <div class="stat"><b>${s.input_tokens}</b><span>входных токенов</span></div>
      <div class="stat"><b>${s.output_tokens}</b><span>выходных</span></div>
      <div class="stat"><b>${s.cache_read_tokens}</b><span>из кэша — это дешевле</span></div>
    </div></div>`));

  document.getElementById('tadd').onclick = async () => {
    const res = await api('/api/tasks', {goal: document.getElementById('tg').value});
    if (res.error) alert(res.error);
    refresh();
  };
  document.getElementById('radd').onclick = async () => {
    const res = await api('/api/reminders', {text: document.getElementById('rt').value,
                                             when: document.getElementById('rw').value});
    if (res.error) alert(res.error);
    refresh();
  };
}

async function cancelTask(id){ await api('/api/tasks/cancel', {id}); refresh(); }
async function cancelReminder(id){ await api('/api/reminders/cancel', {id}); refresh(); }

/* ---------- разрешения ---------- */

async function pollApprovals(){
  const {pending} = await api('/api/pending');
  const box = document.getElementById('approve');
  const item = (pending || [])[0];
  if (item){
    pendingId = item.id;
    document.getElementById('approve-who').textContent = `${item.source} просит разрешение`;
    document.getElementById('approve-text').textContent = item.action;
    box.style.display = 'grid';
  } else {
    pendingId = null;
    box.style.display = 'none';
  }
}

async function resolveApproval(approved){
  if (!pendingId) return;
  await api('/api/approve', {id:pendingId, approved});
  document.getElementById('approve').style.display = 'none';
}

/* ---------- запуск ---------- */

buildNav();
show('feed');
refresh();
const box = document.getElementById('say');
document.getElementById('send').onclick = send;
box.addEventListener('input', () => grow(box));
box.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); }
});
setInterval(refresh, 4000);
setInterval(pollApprovals, 1000);
